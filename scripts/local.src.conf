# 本地手工维护的拦截条目（源文件，由 scripts/build.py 生成 rules/local.merged.conf）
#
# 这份文件承载没法放进 DOMAIN-SET 的非域名型规则（URL-REGEX 等）。
# 原来这些条目来自 byteat/ProxyConfig 的 AppAds.list，现改为自托管，不再依赖外部仓库。
#
# 维护方式：直接改这个文件，然后跑 python3 scripts/build.py

# > Block Update：高德地图更新检测接口
URL-REGEX,^https://m5\.amap\.com/ws/shield/nest/updatable/v1/preUpgrade

# > Deepal：车机 App 开屏广告接口
# 沿用上游 AppAds.list 的写法（/ad/ 结尾），覆盖 /ad/ 下所有子路径，比原先只拦 /ad/startPage 更宽。
URL-REGEX,^https://app-api\.deepal\.com\.cn/appapi/v1/m_app/ad/

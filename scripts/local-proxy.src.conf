# 本地手工维护的 PROXY 条目（源文件，由 scripts/build.py 生成 rules/local-proxy.merged.conf）
#
# 这些条目原先是 profile 里的单条规则，按用户要求统一自托管。
# 保留原来的行内注释与策略列；策略列 PROXY 与文件名一致。
#
# 维护方式：直接改这个文件，然后跑 python3 scripts/build.py

DOMAIN-SUFFIX,googlevideo.com,PROXY

# ==== IP-CIDR（域名之后；IP 匹配会触发 DNS，故置后并带 no-resolve）====
# Google Public DNS 走代理（8.8.8.0/24 只覆盖 8.8.8.8，8.8.4.4 由下一行单独覆盖，勿删下一行）
IP-CIDR,8.8.8.0/24,PROXY,no-resolve
IP-CIDR,8.8.4.0/24,PROXY,no-resolve

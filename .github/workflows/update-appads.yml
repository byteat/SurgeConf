name: Update App Ad Rules

# 每天自动重新生成 App 广告拦截清单。
# 有新条目时自动提交；无变化时什么都不做，不产生空提交。
# 也可以手动触发（workflow_dispatch），用于立即更新。

on:
  schedule:
    # UTC 18:30 = 北京时间次日 02:30，避开 GitHub 整点高峰
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-appads
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 先跑 --check：数据无变化时提前结束，避免后面的提交步骤白跑
      - name: Check for upstream changes
        id: check
        run: |
          set +e
          python3 scripts/build_appads.py --check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过提交"
          elif [ "$code" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变化，准备重新生成"
          else
            echo "构建失败，退出码 $code"
            exit "$code"
          fi

      - name: Regenerate list
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/build_appads.py

      - name: Validate output
        if: steps.check.outputs.changed == 'true'
        run: |
          f=rules/appads.domainset.txt
          # 数据行数与文件头声明的条目数必须一致
          declared=$(grep -oP '^# 条目数：\K[0-9]+' "$f")
          actual=$(grep -vc '^#' "$f")
          echo "声明条目数: $declared / 实际数据行: $actual"
          if [ "$declared" != "$actual" ]; then
            echo "::error::条目数不一致，拒绝提交"
            exit 1
          fi
          # 不得超过上限
          if [ "$actual" -gt 10000 ]; then
            echo "::error::条目数 $actual 超过上限 10000"
            exit 1
          fi
          # 不得含重复
          dup=$(grep -v '^#' "$f" | sort | uniq -d | head -5)
          if [ -n "$dup" ]; then
            echo "::error::存在重复条目: $dup"
            exit 1
          fi
          # 不得含 IP 条目（DOMAIN-SET 不接受，会让整份文件解析失败）
          if grep -v '^#' "$f" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::发现 IP 条目，DOMAIN-SET 不接受"
            exit 1
          fi
          echo "校验通过"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/appads.domainset.txt
          if git diff --cached --quiet; then
            echo "无差异，跳过提交"
            exit 0
          fi
          n=$(grep -vc '^#' rules/appads.domainset.txt)
          msg="自动更新 App 广告清单（${n} 条）"
          msg="${msg}%0A%0A由 .github/workflows/update-appads.yml 每日生成"
          msg="${msg}%0A数据源：AdGuard Mobile Ads / Tracking Protection / Chinese filter"
          git commit -m "$(printf '%b' "${msg//%0A/\\n}")"
          git push

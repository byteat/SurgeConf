name: Update Rules

# 每天自动重新生成全部规则文件：
#   - rules/appads.domainset.txt    App 专用广告拦截清单
#   - rules/{proxy,direct,ai}.merged.conf、rules/ip-*.ruleset.conf
#                                  从上游 skk.moe 合并的非拦截规则
#
# 有变化才提交；无变化不产生空提交。
# 也可手动触发（workflow_dispatch）立即更新。

on:
  schedule:
    # UTC 18:30 = 北京时间次日 02:30，避开 GitHub 整点高峰
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 两步各自比对：任一套有变化就进入生成阶段
      - name: Check appads list
        id: appads
        run: |
          set +e
          python3 scripts/build_appads.py --check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "App 广告清单：上游无变化"
          elif [ "$code" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "App 广告清单：检测到变化"
          else
            echo "::error::build_appads.py 失败，退出码 $code"
            exit "$code"
          fi

      - name: Check merged rules
        id: merged
        run: |
          set +e
          # --check 在有差异时返回 1；但目标文件缺失时也返回非零，属正常（首次生成）
          python3 scripts/build.py --check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "合并规则：上游无变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "合并规则：检测到变化或文件缺失（退出码 $code）"
          fi

      - name: Regenerate appads list
        if: steps.appads.outputs.changed == 'true'
        run: python3 scripts/build_appads.py

      - name: Regenerate merged rules
        if: steps.merged.outputs.changed == 'true'
        run: python3 scripts/build.py

      # 无论哪套被重新生成，都完整校验一遍；任何一项不过就拒绝提交
      - name: Validate all outputs
        run: |
          fail=0

          f=rules/appads.domainset.txt
          if [ -f "$f" ]; then
            declared=$(grep -oP '^# 条目数：\K[0-9]+' "$f" || echo "")
            actual=$(grep -v '^#' "$f" | grep -v -c '^$' || true)
            echo "appads：声明 $declared / 实际 $actual"
            if [ -z "$declared" ] || [ "$declared" != "$actual" ]; then
              echo "::error::appads 条目数与文件头声明不一致"
              fail=1
            fi
            if [ "$actual" -gt 10000 ]; then
              echo "::error::appads 条目数 $actual 超过上限 10000"
              fail=1
            fi
            dup=$(grep -v '^#' "$f" | grep -v '^$' | sort | uniq -d | head -5)
            if [ -n "$dup" ]; then
              echo "::error::appads 存在重复条目: $dup"
              fail=1
            fi
            # DOMAIN-SET 不接受 IP 条目，混入会让整份文件解析失败
            if grep -v '^#' "$f" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::appads 含 IP 条目，DOMAIN-SET 不接受"
              fail=1
            fi
            if grep -v '^#' "$f" | grep -q '\*'; then
              echo "::error::appads 含通配条目，DOMAIN-SET 不支持"
              fail=1
            fi
          else
            echo "::error::appads 文件不存在"
            fail=1
          fi

          # 合并规则：每份都不能为空，也不能含空行断层
          # 必须与 build.py 的产出清单逐一对应，少列一份就等于该份从未被校验
          for g in proxy.merged.conf direct-early.merged.conf direct-late.merged.conf \
                   ai.merged.conf ip-telegram.ruleset.conf ip-domestic.ruleset.conf \
                   local.merged.conf; do
            p="rules/$g"
            if [ ! -f "$p" ]; then
              echo "::error::$g 不存在"
              fail=1
              continue
            fi
            n=$(grep -v '^#' "$p" | grep -v -c '^$' || true)
            echo "$g：$n 条"
            if [ "$n" -eq 0 ]; then
              echo "::error::$g 为空"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::校验未通过，拒绝提交"
            exit 1
          fi
          echo "全部校验通过"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "无差异，跳过提交"
            exit 0
          fi

          # 统计各文件变化，写进提交信息
          summary=""
          if [ -f rules/appads.domainset.txt ]; then
            n=$(grep -v '^#' rules/appads.domainset.txt | grep -v -c '^$')
            summary="appads ${n} 条"
          fi
          changed=$(git diff --cached --name-only | wc -l)
          msg="自动更新规则（${changed} 份文件变更）"
          msg="${msg}%0A%0A${summary}"
          msg="${msg}%0A由 .github/workflows/update-rules.yml 每日生成"
          msg="${msg}%0Aappads 数据源：AdGuard Mobile Ads / Tracking Protection / Chinese filter"
          msg="${msg}%0A合并规则来源：ruleset.skk.moe"
          git commit -m "$(printf '%b' "${msg//%0A/\\n}")"
          git push
